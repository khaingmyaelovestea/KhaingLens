[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khainglens"
version = "0.1.0"
description = "1-Line Python Library & Local-First Toolkit for English and Burmese (Myanmar) Text Dataset Quality Inspection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (Core Library) / Proprietary (UI & Branding)"}
authors = [
    {name = "KhaingLens Project Lead"}
]
keywords = ["nlp", "burmese", "myanmar", "dataset-quality", "unicode", "data-cleaning"]
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.35.0,<2.0.0",
    "plotly>=5.22.0,<6.0.0",
]
dev = [
    "pytest>=8.2.0,<9.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["khainglens*"]