[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khainglens"
version = "0.1.0"
description = "English-Burmese dataset quality inspection Python toolkit and visual UI"
readme = "README.md"
authors = [
    { name = "Khaing Myae Kyaw Swar Myo", email = "khaingmyaekyawswarmyo25@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
keywords = ["nlp", "burmese", "myanmar", "dataset-quality", "data-cleaning", "unicode"]
dependencies = [
    "pandas>=2.0.0",
    "streamlit>=1.28.0",
    "plotly>=5.14.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
ui = [
    "streamlit>=1.28.0",
    "plotly>=5.14.0",
]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/khaingmyaelovestea/KhaingLens"
Repository = "https://github.com/khaingmyaelovestea/KhaingLens.git"

[tool.setuptools.packages.find]
include = ["khainglens", "khainglens.*"]