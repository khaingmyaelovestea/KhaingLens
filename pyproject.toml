[project]
name = "khainglens"
version = "0.1.0"
description = "English-Burmese dataset quality inspection Python toolkit and visual UI"
readme = "README.md"
authors = [
    { name = "Khaing Myae Kyaw Swar Myo", email = "khaingmyaekyawswarmyo25@gmail.com" }
]

# 1. Use a simple SPDX string expression instead of a TOML table
license = "MIT"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # 2. Removed the deprecated "License :: OSI Approved :: MIT License" classifier here
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]